spring:
  application:
    name: graduation-project
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:chess_online_db}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:60000ms}
      lettuce:
        pool:
          enabled: ${REDIS_POOL_ENABLED:true}
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:true}

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        model: ${GROQ_MODEL}

#    model:
#      embedding: transformers
#
#    embedding:
#      transformer:
#        onnx:
#          model-uri: ${EMBEDDING_TRANSFORMER_ONNX_MODEL_URI}
#        tokenizer:
#          uri: ${EMBEDDING_TRANSFORMER_TOKENIZER_URI}
#
#    vectorstore:
#      pgvector:
#        initialize-schema: false
#        dimensions: 384
#        distance-type: cosine_distance
#        index-type: hnsw

logging:
  level:
    p6spy: DEBUG

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-exp-sec: ${ACCESS_TOKEN_EXP_SEC}
      refresh-token-exp-days: ${REFRESH_TOKEN_EXP_DAYS}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  thread-pool:
    async:
      core-size: ${ASYNC_CORE_SIZE}
      max-size: ${ASYNC_MAX_SIZE}
      queue-capacity: ${ASYNC_QUEUE_CAPACITY}
      await-termination-seconds: ${ASYNC_AWAIT_TERMINATION}
    scheduler:
      pool-size: ${SCHEDULER_POOL_SIZE}
      await-termination-seconds: ${SCHEDULER_AWAIT_TERMINATION}

  superuser:
    email: ${SUPERUSER_EMAIL}
    username: ${SUPERUSER_USERNAME}
    password: ${SUPERUSER_PASSWORD}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  websocket:
    broker:
      type: ${WEBSOCKET_BROKER_TYPE:simple}
    rabbitmq-stomp-host: ${RABBITMQ_STOMP_HOST:localhost}
    rabbitmq-stomp-port: ${RABBITMQ_STOMP_PORT:61613}
    rabbitmq-stomp-login: ${RABBITMQ_STOMP_LOGIN:guest}
    rabbitmq-stomp-passcode: ${RABBITMQ_STOMP_PASSCODE:guest}

  rabbitmq:
    exchange:
      main: app.exchange
      dlx: app.dlx
    queues:
      post:
        name: post.queue
        dlq: post.dead.queue
        routing-key: post.#
        dlq-routing-key: post.dead
      comment:
        name: comment.queue
        dlq: comment.dead.queue
        routing-key: comment.#
        dlq-routing-key: comment.dead
      notification:
        name: notification.queue
        dlq: notification.dead.queue
        routing-key: notification.#
        dlq-routing-key: notification.dead
    retry:
      max-attempts: 3
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 10000

  user:
    guest-max-age-days: 30