name: Server Lint

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipTests
