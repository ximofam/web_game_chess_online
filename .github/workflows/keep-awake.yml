name: Keep Render App Awake

on:
  schedule:
    - cron: '*/14 * * * *' # Chạy mỗi 14 phút
  workflow_dispatch: # Cho phép chạy thủ công
    inputs:
      target_url:
        description: 'URL để ping (Mặc định sẽ lấy từ RENDER_APP_URL trong Repository Variables hoặc Secrets)'
        required: false
        type: string

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        env:
          DEFAULT_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          INPUT_URL: ${{ inputs.target_url }}
        run: |
          # Ưu tiên lấy URL từ input (nếu chạy thủ công), nếu không thì lấy từ biến môi trường
          TARGET_URL="${INPUT_URL:-$DEFAULT_URL}"
          
          if [ -z "$TARGET_URL" ]; then
            echo "Lỗi: Không tìm thấy URL. Vui lòng cấu hình RENDER_APP_URL trong Settings > Secrets and variables > Actions hoặc truyền vào target_url khi chạy thủ công."
            exit 1
          fi
          
          echo "Đang ping tới: $TARGET_URL"
          curl -s "$TARGET_URL" > /dev/null
