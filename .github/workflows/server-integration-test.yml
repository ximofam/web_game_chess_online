name: Server API Integration Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - '.github/workflows/server-**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - '.github/workflows/server-**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Docker is pre-installed on ubuntu-latest; Testcontainers manages Postgres/Redis/RabbitMQ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        working-directory: server
        env:
          JWT_SECRET_KEY: RGF5TGFNb3RDaHVvaUJpTWF0RGFuaENob01vaVRydW9uZ1Rlc3REdURhaTI1NkJpdA==
          ACCESS_TOKEN_EXP_SEC: 3600
          REFRESH_TOKEN_EXP_DAYS: 7
          # Testcontainers connects via Docker socket — no external service env vars needed
          TESTCONTAINERS_RYUK_DISABLED: false
        run: ./mvnw clean test -Dspring.profiles.active=test --no-transfer-progress