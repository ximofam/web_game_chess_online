spring:
  flyway:
    enabled: true
    clean-disabled: false

  data:
    redis:
      # URL is overridden at runtime by TestcontainersConfig.redisProperties()
      timeout: 60000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2s

  rabbitmq:
    listener:
      simple:
        auto-startup: false   # don't start consumers in test context

  ai:
    openai:
      api-key: dummy_key_for_tests   # prevents real API calls during context load

app:
  security:
    jwt:
      secret-key: RGF5TGFNb3RDaHVvaUJpTWF0RGFuaENob01vaVRydW9uZ1Rlc3REdURhaTI1NkJpdA==
      access-token-exp-sec: 3600
      refresh-token-exp-days: 7
  thread-pool:
    async:
      core-size: 1
      max-size: 2
      queue-capacity: 10
      await-termination-seconds: 10
    scheduler:
      pool-size: 1
      await-termination-seconds: 10
  superuser:
    email: admin@test.local
    username: admin
    password: admin123
  cloudinary:
    cloud-name: dummy_cloud
    api-key: dummy_key
    api-secret: dummy_secret
  websocket:
    broker-relay:
      enabled: false
